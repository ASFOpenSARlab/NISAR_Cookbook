[workspace]
authors = ["Alex-Lewandowski <aflewandowski@alaska.edu>"]
channels = ["conda-forge"]
name = "NISAR_GCOV_Cookbook"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.2"

[feature.base.dependencies]
python = "<3.12"
pip = ">=25.3,<26"
mystmd = ">=1.6.4,<2"
jupyterlab = ">=4.4.10,<5"
jupyterlab-myst = ">=2.4.2,<3"
ipykernel = ">=7.1.0,<8"
ipyfilechooser = ">=0.6.0,<0.7"

[feature.isce3.dependencies]
isce3 = ">=0.25.0"
rioxarray = "*"
xarray = "*"
pandas = "*"
contextily = "*"
cartopy = "*"
h5py = "*"
numpy = "*"
asf_search = "*"
earthaccess = "*"
dask = "*"
matplotlib-base = "*"
ipympl = "*"
ipykernel = "*"
jupyterlab = "*"
jupyterlab-myst = "*"
mystmd = "*"
pip = "*"
python = "==3.13"
h5netcdf = "*"
zarr = "*"
folium = "*"
ipyfilechooser = "*"
ipyleaflet = "*"
openseppo = "*"
aria2 = "*"
plant-isce3 = "*"
sardem = "*"
pygrib = "*"
snaphu = "*"
whirlwind-insar = "*"
pyaps3 = "*"
libgdal-hdf5 = "*"

[feature.isce3.pypi-dependencies]
polsartools = "*"
jb-toc = "*"

[environments]
default = ["base"]
isce3 = ["isce3"]

[feature.isce3.tasks]
register-kernel = "python -m ipykernel install --user --name isce3 --display-name 'isce3 (Python)'"
lab = { cmd = "jupyter lab", depends-on = ["register-kernel"] }